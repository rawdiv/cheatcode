<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - CheatCode</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .editor-container {
            height: 300px;
            border-radius: 0.5rem;
            overflow: hidden;
        }
        
        .code-editor {
            width: 100%;
            height: 100%;
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Fira Code', monospace;
            resize: none;
            padding: 1rem;
            border: none;
            outline: none;
        }
        
        .tab-active {
            border-bottom: 2px solid #FFD43B;
            color: #FFD43B;
        }
    </style>
</head>
<body>
    <header class="py-4 border-b border-gray-800">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-yellow-300">CheatCode</a>
            <nav class="hidden md:block">
                <ul class="flex space-x-6">
                    <li><a href="problem.html" class="hover:text-yellow-300 transition-colors">Problems</a></li>
                    <li><a href="/admin" class="text-yellow-300 transition-colors">Admin</a></li>
                    <li><a href="dashboard.html" class="hover:text-yellow-300 transition-colors">Dashboard</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container mx-auto px-4 py-8">
        <h1 class="text-2xl font-bold mb-6">Admin Panel</h1>
        
        <!-- Tabs -->
        <div class="mb-6 border-b border-gray-800">
            <ul class="flex space-x-6 -mb-px">
                <li>
                    <button id="problems-tab" class="tab-active py-2 px-1">Problems</button>
                </li>
                <li>
                    <button id="add-problem-tab" class="py-2 px-1 hover:text-yellow-300">Add Problem</button>
                </li>
                <li>
                    <button id="bulk-upload-tab" class="py-2 px-1 hover:text-yellow-300">Bulk Upload</button>
                </li>
            </ul>
        </div>
        
        <!-- Problems List Panel -->
        <div id="problems-panel" class="panel-active">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center">
                    <select id="filter-difficulty" class="bg-gray-800 text-gray-300 rounded px-2 py-1 border border-gray-700 mr-2">
                        <option value="">All Difficulties</option>
                        <option value="easy">Easy</option>
                        <option value="medium">Medium</option>
                        <option value="hard">Hard</option>
                    </select>
                    <input type="text" id="search-problems" placeholder="Search problems..." class="bg-gray-800 text-gray-300 rounded px-2 py-1 border border-gray-700">
                </div>
                <div class="flex items-center">
                    <button id="bulk-delete-btn" class="bg-red-700 hover:bg-red-600 text-white py-1 px-3 rounded-md mr-2" disabled>
                        Delete Selected
                    </button>
                    <button id="refresh-problems" class="bg-gray-700 hover:bg-gray-600 text-white py-1 px-3 rounded-md">
                        Refresh
                    </button>
                </div>
            </div>
            
            <div class="bg-gray-900 rounded-lg overflow-hidden">
                <table class="min-w-full divide-y divide-gray-800">
                    <thead class="bg-gray-800">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">
                                <input type="checkbox" id="select-all" class="rounded border-gray-600 text-yellow-500 focus:ring-yellow-500">
                            </th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">
                                Title
                            </th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">
                                Difficulty
                            </th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">
                                Topics
                            </th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">
                                Actions
                            </th>
                        </tr>
                    </thead>
                    <tbody id="problems-list" class="bg-gray-900 divide-y divide-gray-800">
                        <!-- Problems will be listed here dynamically -->
                        <tr>
                            <td colspan="5" class="px-6 py-4 text-center text-gray-400">
                                Loading problems...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- Add Problem Panel -->
        <div id="add-problem-panel" class="hidden">
            <form id="add-problem-form" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1">Title</label>
                        <input type="text" name="title" required class="w-full bg-gray-800 text-gray-300 rounded px-3 py-2 border border-gray-700">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1">Difficulty</label>
                        <select name="difficulty" required class="w-full bg-gray-800 text-gray-300 rounded px-3 py-2 border border-gray-700">
                            <option value="easy">Easy</option>
                            <option value="medium">Medium</option>
                            <option value="hard">Hard</option>
                        </select>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Topics (comma separated)</label>
                    <input type="text" name="topics" class="w-full bg-gray-800 text-gray-300 rounded px-3 py-2 border border-gray-700">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Problem Description (Markdown supported)</label>
                    <textarea name="description" rows="5" required class="w-full bg-gray-800 text-gray-300 rounded px-3 py-2 border border-gray-700"></textarea>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Examples (JSON format)</label>
                    <div class="editor-container">
                        <textarea id="examples-editor" name="examples" class="code-editor">[
  {
    "input": "nums = [2,7,11,15], target = 9",
    "output": "[0,1]",
    "explanation": "Because nums[0] + nums[1] == 9, we return [0, 1]."
  }
]</textarea>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Test Cases (JSON format)</label>
                    <div class="editor-container">
                        <textarea id="testcases-editor" name="testCases" class="code-editor">[
  {
    "input": {"nums": [2,7,11,15], "target": 9},
    "output": [0,1]
  },
  {
    "input": {"nums": [3,2,4], "target": 6},
    "output": [1,2]
  }
]</textarea>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Code Template</label>
                    <div class="editor-container">
                        <textarea id="code-template-editor" name="code_template" class="code-editor">function twoSum(nums, target) {
    // Your code here
}</textarea>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Solution</label>
                    <div class="editor-container">
                        <textarea id="solution-editor" name="solution" class="code-editor">{
  "code": "function twoSum(nums, target) {\n  const map = new Map();\n  \n  for (let i = 0; i < nums.length; i++) {\n    const complement = target - nums[i];\n    \n    if (map.has(complement)) {\n      return [map.get(complement), i];\n    }\n    \n    map.set(nums[i], i);\n  }\n  \n  return [];\n}",
  "approach": "Using a hash map to store numbers and their indices. For each number, we check if its complement (target - current number) exists in the map. This gives us O(n) time complexity.",
  "time_complexity": "O(n)",
  "space_complexity": "O(n)"
}</textarea>
                    </div>
                </div>
                
                <div class="flex justify-end">
                    <button type="submit" class="bg-yellow-600 hover:bg-yellow-500 text-white py-2 px-6 rounded-md">
                        Add Problem
                    </button>
                </div>
            </form>
        </div>
        
        <!-- Bulk Upload Panel -->
        <div id="bulk-upload-panel" class="hidden">
            <p class="text-gray-300 mb-4">
                Paste JSON array of problems to import them in bulk or upload a JSON file. Each problem should follow the same structure as the "Add Problem" form.
            </p>
            
            <!-- File Upload Option -->
            <div class="mb-4 p-4 border border-gray-800 rounded-lg">
                <label class="block text-sm font-medium text-gray-400 mb-2">Upload JSON File</label>
                <div class="flex items-center">
                    <input type="file" id="json-file-input" accept=".json" class="hidden" />
                    <label for="json-file-input" class="cursor-pointer bg-gray-800 hover:bg-gray-700 text-gray-300 py-2 px-4 rounded-md inline-block">
                        Select File
                    </label>
                    <span id="file-name" class="ml-3 text-gray-400 text-sm">No file selected</span>
                </div>
                <button id="load-file-btn" class="mt-2 bg-blue-700 hover:bg-blue-600 text-white py-1 px-4 rounded-md text-sm" disabled>
                    Load File Content
                </button>
            </div>
            
            <div class="editor-container h-96 mb-4">
                <textarea id="bulk-upload-editor" class="code-editor">[
  {
    "title": "Maximum Subarray Sum",
    "difficulty": "medium",
    "topics": ["arrays", "dynamic-programming", "kadane-algorithm"],
    "description": "Given an integer array `nums`, find the contiguous subarray (containing at least one number) which has the largest sum and return its sum.\n\nA subarray is a contiguous part of an array.",
    "examples": [
      {
        "input": "nums = [-2,1,-3,4,-1,2,1,-5,4]",
        "output": "6",
        "explanation": "The subarray [4,-1,2,1] has the largest sum = 6."
      }
    ],
    "testCases": [
      {
        "input": {"nums": [-2,1,-3,4,-1,2,1,-5,4]},
        "output": 6
      },
      {
        "input": {"nums": [1]},
        "output": 1
      }
    ],
    "code_template": "function maxSubArray(nums) {\n    // Your code here\n}",
    "solution": {
      "code": "function maxSubArray(nums) {\n  let maxSum = nums[0];\n  let currentSum = nums[0];\n  \n  for (let i = 1; i < nums.length; i++) {\n    currentSum = Math.max(nums[i], currentSum + nums[i]);\n    maxSum = Math.max(maxSum, currentSum);\n  }\n  \n  return maxSum;\n}",
      "approach": "Using Kadane's algorithm to find the maximum subarray sum. We track the maximum sum ending at the current position and the overall maximum sum.",
      "time_complexity": "O(n)",
      "space_complexity": "O(1)"
    }
  }
]</textarea>
            </div>
            
            <div class="flex justify-end">
                <button id="bulk-upload-btn" class="bg-yellow-600 hover:bg-yellow-500 text-white py-2 px-6 rounded-md">
                    Upload Problems
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Tab switching logic
            const tabs = ['problems', 'add-problem', 'bulk-upload'];
            
            tabs.forEach(tab => {
                document.getElementById(`${tab}-tab`).addEventListener('click', () => {
                    // Hide all panels
                    tabs.forEach(t => {
                        document.getElementById(`${t}-panel`).classList.add('hidden');
                        document.getElementById(`${t}-tab`).classList.remove('tab-active');
                    });
                    
                    // Show selected panel
                    document.getElementById(`${tab}-panel`).classList.remove('hidden');
                    document.getElementById(`${tab}-tab`).classList.add('tab-active');
                });
            });
            
            // Load problems
            function loadProblems() {
                const difficulty = document.getElementById('filter-difficulty').value;
                
                fetch(`/api/problems?difficulty=${difficulty}`)
                    .then(response => response.json())
                    .then(problems => {
                        const problemsList = document.getElementById('problems-list');
                        
                        if (problems.length === 0) {
                            problemsList.innerHTML = `
                                <tr>
                                    <td colspan="5" class="px-6 py-4 text-center text-gray-400">
                                        No problems found
                                    </td>
                                </tr>
                            `;
                            return;
                        }
                        
                        problemsList.innerHTML = problems.map(problem => `
                            <tr>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <input type="checkbox" class="problem-checkbox rounded border-gray-600 text-yellow-500 focus:ring-yellow-500" data-id="${problem.id}">
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <div class="text-sm font-medium text-gray-300">${problem.title}</div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full 
                                        ${problem.difficulty === 'easy' ? 'bg-green-900 text-green-300' : 
                                          problem.difficulty === 'medium' ? 'bg-yellow-900 text-yellow-300' : 
                                          'bg-red-900 text-red-300'}">
                                        ${problem.difficulty}
                                    </span>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <div class="text-sm text-gray-400">
                                        ${Array.isArray(problem.topics) ? problem.topics.join(', ') : problem.topics || ''}
                                    </div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                    <button class="text-yellow-400 hover:text-yellow-300 mr-3" 
                                        onclick="editProblem('${problem.id}')">Edit</button>
                                    <button class="text-red-400 hover:text-red-300" 
                                        onclick="deleteProblem('${problem.id}')">Delete</button>
                                </td>
                            </tr>
                        `).join('');

                        // Set up checkbox event listeners after loading problems
                        setupCheckboxListeners();
                    })
                    .catch(error => {
                        console.error('Error loading problems:', error);
                        document.getElementById('problems-list').innerHTML = `
                            <tr>
                                <td colspan="5" class="px-6 py-4 text-center text-red-400">
                                    Error loading problems
                                </td>
                            </tr>
                        `;
                    });
            }
            
            // Filter problems by difficulty
            document.getElementById('filter-difficulty').addEventListener('change', loadProblems);
            
            // Refresh problems
            document.getElementById('refresh-problems').addEventListener('click', loadProblems);
            
            // Add problem form submission
            document.getElementById('add-problem-form').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const formData = new FormData(this);
                const problem = {
                    title: formData.get('title'),
                    difficulty: formData.get('difficulty'),
                    topics: formData.get('topics').split(',').map(topic => topic.trim()),
                    description: formData.get('description'),
                    examples: JSON.parse(formData.get('examples')),
                    testCases: JSON.parse(formData.get('testCases')),
                    code_template: formData.get('code_template'),
                    solution: JSON.parse(formData.get('solution'))
                };
                
                fetch('/api/problems', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(problem),
                    credentials: 'include'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('Problem added successfully!');
                        // Switch to problems tab
                        document.getElementById('problems-tab').click();
                        loadProblems();
                    } else {
                        alert(`Error: ${data.error}`);
                    }
                })
                .catch(error => {
                    console.error('Error adding problem:', error);
                    alert('Failed to add problem. See console for details.');
                });
            });
            
            // Bulk upload
            document.getElementById('bulk-upload-btn').addEventListener('click', function() {
                try {
                    const problems = JSON.parse(document.getElementById('bulk-upload-editor').value);
                    
                    if (!Array.isArray(problems)) {
                        throw new Error('Input must be an array of problems');
                    }
                    
                    fetch('/api/problems/bulk', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ problems }),
                        credentials: 'include'
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            alert(`${data.count} problems imported successfully!`);
                            // Switch to problems tab
                            document.getElementById('problems-tab').click();
                            loadProblems();
                        } else {
                            alert(`Error: ${data.error}`);
                        }
                    })
                    .catch(error => {
                        console.error('Error importing problems:', error);
                        alert('Failed to import problems. See console for details.');
                    });
                } catch (error) {
                    alert(`Invalid JSON: ${error.message}`);
                }
            });
            
            // File upload handling
            const fileInput = document.getElementById('json-file-input');
            const fileNameDisplay = document.getElementById('file-name');
            const loadFileBtn = document.getElementById('load-file-btn');
            const bulkUploadEditor = document.getElementById('bulk-upload-editor');
            
            fileInput.addEventListener('change', function(e) {
                if (e.target.files.length > 0) {
                    const fileName = e.target.files[0].name;
                    fileNameDisplay.textContent = fileName;
                    loadFileBtn.disabled = false;
                } else {
                    fileNameDisplay.textContent = 'No file selected';
                    loadFileBtn.disabled = true;
                }
            });
            
            loadFileBtn.addEventListener('click', function() {
                const file = fileInput.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        // Try to parse the JSON to validate it
                        const jsonContent = e.target.result;
                        const problems = JSON.parse(jsonContent);
                        
                        if (!Array.isArray(problems)) {
                            throw new Error('JSON file must contain an array of problems');
                        }
                        
                        // Set the content to the editor with proper formatting
                        bulkUploadEditor.value = JSON.stringify(problems, null, 2);
                        alert('JSON file loaded successfully!');
                    } catch (error) {
                        alert(`Error parsing JSON file: ${error.message}`);
                    }
                };
                reader.onerror = function() {
                    alert('Error reading file');
                };
                reader.readAsText(file);
            });
            
            // Delete problem
            window.deleteProblem = function(problemId) {
                if (confirm('Are you sure you want to delete this problem?')) {
                    fetch(`/api/problems/${problemId}`, {
                        method: 'DELETE',
                        credentials: 'include'
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            alert('Problem deleted successfully!');
                            loadProblems();
                        } else {
                            alert(`Error: ${data.error}`);
                        }
                    })
                    .catch(error => {
                        console.error('Error deleting problem:', error);
                        alert('Failed to delete problem. See console for details.');
                    });
                }
            };
            
            // Edit problem
            window.editProblem = function(problemId) {
                // Fetch problem data
                fetch(`/api/problems/${problemId}`)
                    .then(response => response.json())
                    .then(problem => {
                        // Switch to add problem tab
                        document.getElementById('add-problem-tab').click();
                        
                        // Update form title
                        document.querySelector('#add-problem-panel h2').textContent = 'Edit Problem';
                        
                        // Populate form fields
                        const form = document.getElementById('add-problem-form');
                        form.querySelector('[name="title"]').value = problem.title;
                        form.querySelector('[name="difficulty"]').value = problem.difficulty;
                        form.querySelector('[name="topics"]').value = Array.isArray(problem.topics) ? problem.topics.join(', ') : problem.topics || '';
                        form.querySelector('[name="description"]').value = problem.description;
                        form.querySelector('[name="examples"]').value = JSON.stringify(problem.examples || [], null, 2);
                        form.querySelector('[name="testCases"]').value = JSON.stringify(problem.testCases || [], null, 2);
                        form.querySelector('[name="code_template"]').value = problem.code_template || '';
                        document.getElementById('solution-editor').value = JSON.stringify(problem.solution || {}, null, 2);
                        
                        // Update submit button
                        const submitBtn = form.querySelector('button[type="submit"]');
                        submitBtn.textContent = 'Update Problem';
                        
                        // Add problem ID to form for update
                        form.dataset.problemId = problemId;
                        
                        // Update form submission handler
                        form.onsubmit = function(e) {
                            e.preventDefault();
                            
                            const formData = new FormData(this);
                            const updatedProblem = {
                                title: formData.get('title'),
                                difficulty: formData.get('difficulty'),
                                topics: formData.get('topics').split(',').map(topic => topic.trim()),
                                description: formData.get('description'),
                                examples: JSON.parse(formData.get('examples')),
                                testCases: JSON.parse(formData.get('testCases')),
                                code_template: formData.get('code_template'),
                                solution: JSON.parse(formData.get('solution'))
                            };
                            
                            // Send update request
                            fetch(`/api/problems/${problemId}`, {
                                method: 'PUT',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify(updatedProblem)
                            })
                            .then(response => response.json())
                            .then(data => {
                                if (data.success) {
                                    alert('Problem updated successfully!');
                                    // Reset form and switch to problems tab
                                    form.reset();
                                    form.removeAttribute('data-problem-id');
                                    submitBtn.textContent = 'Add Problem';
                                    document.getElementById('problems-tab').click();
                                    loadProblems();
                                } else {
                                    alert(`Error: ${data.error}`);
                                }
                            })
                            .catch(error => {
                                console.error('Error updating problem:', error);
                                alert('Failed to update problem. See console for details.');
                            });
                        };
                    })
                    .catch(error => {
                        console.error('Error fetching problem:', error);
                        alert('Failed to load problem data. See console for details.');
                    });
            };
            
            // Function to set up checkbox event listeners
            function setupCheckboxListeners() {
                const selectAllCheckbox = document.getElementById('select-all');
                const problemCheckboxes = document.querySelectorAll('.problem-checkbox');
                const bulkDeleteBtn = document.getElementById('bulk-delete-btn');

                // Remove existing event listeners
                selectAllCheckbox.removeEventListener('change', handleSelectAll);
                problemCheckboxes.forEach(checkbox => {
                    checkbox.removeEventListener('change', updateBulkDeleteButton);
                });

                // Add new event listeners
                selectAllCheckbox.addEventListener('change', handleSelectAll);
                problemCheckboxes.forEach(checkbox => {
                    checkbox.addEventListener('change', updateBulkDeleteButton);
                });

                // Update bulk delete button state
                updateBulkDeleteButton();
            }

            // Handle select all checkbox
            function handleSelectAll() {
                const problemCheckboxes = document.querySelectorAll('.problem-checkbox');
                problemCheckboxes.forEach(checkbox => {
                    checkbox.checked = this.checked;
                });
                updateBulkDeleteButton();
            }

            // Update bulk delete button state
            function updateBulkDeleteButton() {
                const checkedBoxes = document.querySelectorAll('.problem-checkbox:checked');
                const bulkDeleteBtn = document.getElementById('bulk-delete-btn');
                bulkDeleteBtn.disabled = checkedBoxes.length === 0;
            }

            // Bulk delete button click handler
            document.getElementById('bulk-delete-btn').addEventListener('click', function() {
                const selectedIds = Array.from(document.querySelectorAll('.problem-checkbox:checked'))
                    .map(checkbox => checkbox.dataset.id);

                if (selectedIds.length === 0) return;

                if (confirm(`Are you sure you want to delete ${selectedIds.length} selected problems?`)) {
                    fetch('/api/problems/bulk-delete', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ problemIds: selectedIds })
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            alert(`Successfully deleted ${data.count} problems!`);
                            // Reset select all checkbox
                            document.getElementById('select-all').checked = false;
                            // Reload problems
                            loadProblems();
                        } else {
                            alert(`Error: ${data.error}`);
                        }
                    })
                    .catch(error => {
                        console.error('Error deleting problems:', error);
                        alert('Failed to delete problems. See console for details.');
                    });
                }
            });
            
            // Load problems on page load
            loadProblems();
        });
    </script>
</body>
</html>
